<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrono Rush: Galaxy Arenas - SEASON 2 VERTICAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #02020a;
            --cyber-blue: #00f0ff;
            --cyber-pink: #ff0055;
            --neon-green: #39ff14;
            --gold-vip: #ffd700;
            --galaxy-purple: #b026ff;
            --text-main: #e2e8f0;
            --card-bg: rgba(6, 6, 18, 0.9);
            --neon-glow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        /* --- CÓDIGO VERSO: EFECTO DORADO ANIMADO --- */
        @keyframes goldGlowWave {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .verso-gold-text {
            background: linear-gradient(90deg, #ffd700, #fff59d, #ff9100, #ffd700);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
            animation: goldGlowWave 2s linear infinite;
        }

        body.verso-vip-mode {
            --cyber-blue: var(--gold-vip);
            --neon-glow: 0 0 15px rgba(255, 215, 0, 0.6);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #000;
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- CONTENEDOR VERTICAL GLOBAL (Estilo Celular) --- */
        .phone-wrapper {
            width: 100vw;
            height: 100vh;
            max-width: 480px; /* Límite de anchura tipo smartphone */
            background-color: var(--bg-dark);
            border-left: 1px solid rgba(0, 240, 255, 0.15);
            border-right: 1px solid rgba(0, 240, 255, 0.15);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }

        canvas#bg-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
        }

        .game-view { display: none; width: 100%; flex: 1; padding: 15px; overflow-y: auto; z-index: 2; }
        .game-view.active { display: flex; flex-direction: column; }

        h1 {
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--cyber-blue);
            text-shadow: var(--neon-glow);
            text-align: center;
            font-size: 1.4rem;
            margin-top: 5px;
        }
        .season-tag {
            text-align: center;
            font-size: 0.75rem;
            letter-spacing: 4px;
            color: var(--cyber-pink);
            font-weight: 700;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        /* Navbar Superior (Ajustada para pantallas angostas) */
        .top-navbar {
            background: rgba(2, 2, 8, 0.95);
            border-bottom: 2px solid var(--cyber-blue);
            box-shadow: var(--neon-glow);
            z-index: 100;
            width: 100%;
        }
        .resources-display { 
            display: flex; 
            justify-content: space-around; 
            padding: 8px 5px; 
            font-size: 0.9rem; 
            font-weight: bold; 
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .resource-item i { color: var(--cyber-blue); margin-right: 3px;}
        .resource-item.coins i { color: #ffcc00; }
        .resource-item.crystals i { color: #d500f9; }

        .nav-buttons { display: flex; width: 100%; }
        button.btn-menu {
            flex: 1; background: transparent; border: none; color: #8a939e;
            padding: 10px 2px; cursor: pointer; font-family: 'Orbitron', sans-serif;
            font-weight: bold; transition: all 0.2s ease; font-size: 0.7rem;
            text-align: center; border-bottom: 2px solid transparent;
        }
        button.btn-menu:hover, button.btn-menu.active {
            color: var(--cyber-blue); border-bottom-color: var(--cyber-blue); background: rgba(0,240,255,0.05);
        }

        /* Grid de Arenas Vertical */
        .arenas-grid {
            display: flex; flex-direction: column; gap: 10px; width: 100%; padding-bottom: 20px;
        }
        .arena-node {
            background: var(--card-bg); border: 1px solid rgba(0, 240, 255, 0.15);
            border-radius: 6px; padding: 12px; text-align: left; cursor: pointer; transition: all 0.2s;
            display: flex; justify-content: space-between; align-items: center;
        }
        .arena-node.unlocked:hover {
            border-color: var(--cyber-blue); box-shadow: var(--neon-glow);
        }
        .arena-node.locked { opacity: 0.3; cursor: not-allowed; background: #000; }
        .arena-node h3 { font-family: 'Orbitron', sans-serif; font-size: 0.95rem; }

        /* Quantum Pass */
        .pass-container {
            width: 100%; background: var(--card-bg); border: 1px solid var(--cyber-blue);
            padding: 15px; border-radius: 8px; box-shadow: var(--neon-glow);
        }
        .progress-bar-bg { width: 100%; background: #15151c; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 5px; }
        .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--cyber-pink), var(--cyber-blue)); }
        .rewards-timeline { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; }
        .reward-tier-card {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(10, 12, 32, 0.8); border: 1px solid rgba(255,255,255,0.08);
            padding: 10px; border-radius: 6px;
        }
        .reward-tier-card.unlocked-tier { border-color: var(--neon-green); }

        /* Gacha Panel */
        .gacha-panel { width: 100%; text-align: center; }
        .gacha-display-box {
            background: #03030f; border: 2px dashed rgba(0, 240, 255, 0.3); padding: 25px; border-radius: 8px; margin-bottom: 15px; min-height: 160px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        /* Raridades T2 Cartas */
        .card-item {
            background: rgba(12,15,35,0.95); border: 2px solid #444; padding: 15px;
            border-radius: 8px; width: 130px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.6);
        }
        .card-item.gold { border-color: var(--gold-vip); background: linear-gradient(135deg, #1f1900 0%, #050614 100%); }
        .card-item.galaxy { border-color: var(--galaxy-purple); background: linear-gradient(135deg, #190033 0%, #020208 100%); animation: galaxyShift 2.5s infinite alternate; }

        /* --- MAPA DE JUEGO VERTICAL --- */
        #arena-stage {
            flex: 1; background: radial-gradient(circle, #070819 0%, #010105 100%);
            border: 2px solid rgba(0, 240, 255, 0.2); position: relative; overflow: hidden; border-radius: 8px;
            box-shadow: inset 0 0 30px #000; width: 100%;
        }
        /* La línea de meta ahora está abajo en la pantalla horizontalmente */
        .base-gate-line { 
            position: absolute; left: 0; right: 0; bottom: 65px; height: 2px; 
            background: dashed var(--cyber-pink); opacity: 0.4; box-shadow: 0 0 6px var(--cyber-pink); 
        }
        
        /* Entidades del TD Ajustadas */
        .td-unit { position: absolute; transform: translate(-50%, -50%); width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; z-index: 10; pointer-events: none; }
        .tower-laser { background: rgba(0,240,255,0.1); border: 2px solid var(--cyber-blue); box-shadow: var(--neon-glow); }
        .tower-plasma { background: rgba(176,38,255,0.1); border: 2px solid var(--galaxy-purple); box-shadow: 0 0 10px var(--galaxy-purple); }
        .tower-tesla { background: rgba(255,215,0,0.1); border: 2px solid var(--gold-vip); box-shadow: 0 0 10px var(--gold-vip); }
        .enemy-marcher { background: rgba(255,0,85,0.1); border: 2px solid var(--cyber-pink); border-radius: 4px; box-shadow: 0 0 6px var(--cyber-pink); }

        /* Freeze Layer Móvil */
        #freeze-ui {
            position: absolute; top:0; left:0; right:0; bottom:0; background: rgba(2, 4, 22, 0.75); backdrop-filter: blur(4px);
            z-index: 50; display: none; flex-direction: column; align-items: center; justify-content: space-between; padding: 15px; pointer-events: none;
        }
        #freeze-ui * { pointer-events: auto; }
        .freeze-counter { font-family: 'Orbitron'; font-size: 3.5rem; font-weight: 900; color: #fff; text-shadow: 0 0 20px var(--cyber-blue); }

        /* Footer de Control Táctico Inferior */
        .battle-footer-s2 {
            background: rgba(3, 3, 10, 0.95); padding: 10px; border: 1px solid rgba(0, 240, 255, 0.2); 
            display: flex; flex-direction: column; gap: 8px; border-radius: 6px; width: 100%;
        }
        .deck-flex-container { display: flex; gap: 5px; justify-content: center; width: 100%; }
        .hand-card-s2 {
            flex: 1; background: #0b0d24; border: 1px solid rgba(0,240,255,0.2); padding: 8px 2px; text-align: center; border-radius: 4px; cursor: pointer; font-size: 0.65rem;
        }
        .hand-card-s2.selected { border-color: var(--neon-green); box-shadow: 0 0 8px var(--neon-green); background: rgba(0,40,15,0.5); }

        /* Efectos Especiales */
        .visual-comet {
            position: absolute; width: 22px; height: 22px; background: radial-gradient(circle, #fff 0%, #ff0055 70%, transparent 100%);
            border-radius: 50%; box-shadow: 0 0 20px #ff0055; z-index: 99; transform: translate(-50%, -50%); transition: left 0.2s linear, top 0.2s linear;
        }
        .fire-puddle {
            position: absolute; transform: translate(-50%, -50%); width: 70px; height: 70px;
            background: radial-gradient(circle, rgba(255,0,85,0.4) 0%, rgba(176,38,255,0.1) 60%, transparent 80%);
            border-radius: 50%; z-index: 5; pointer-events: none;
        }

        .generic-panel { width: 100%; background: var(--card-bg); border: 1px solid var(--cyber-blue); padding: 15px; border-radius: 8px; }
        .form-group input[type="text"] { width: 100%; background: #000; border: 1px solid rgba(0,240,255,0.25); padding: 10px; color: #fff; font-family: inherit; }
        
        .btn-action { background: var(--cyber-blue); color: #000; border: none; padding: 10px; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; width: 100%; font-size: 0.85rem; }
        
        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 999; padding: 20px; }
        .modal-box { background: #040512; border: 2px solid var(--cyber-pink); padding: 20px; width: 100%; max-width: 350px; text-align: center; border-radius: 6px; }
    </style>
</head>
<body>

    <!-- CAJA DEL DISPOSITIVO MÓVIL -->
    <div class="phone-wrapper">
        <canvas id="bg-canvas"></canvas>

        <!-- Navbar de Pestañas Móviles -->
        <div class="top-navbar">
            <div class="resources-display">
                <div class="resource-item" style="max-width: 110px; overflow: hidden; white-space: nowrap;"><i class="fas fa-user-shield"></i><span id="username-display">C_VERSO</span></div>
                <div class="resource-item coins"><i class="fas fa-coins"></i><span id="nav-coins">0</span></div>
                <div class="resource-item crystals"><i class="fas fa-gem"></i><span id="nav-crystals">0</span></div>
            </div>
            <div class="nav-buttons">
                <button class="btn-menu active" id="nav-btn-arenas" onclick="switchView('arenas')">S2 Sectores</button>
                <button class="btn-menu" id="nav-btn-pass" onclick="switchView('pass')">Q-Pass</button>
                <button class="btn-menu" id="nav-btn-gacha" onclick="switchView('gacha')">Cápsulas</button>
                <button class="btn-menu" id="nav-btn-config" onclick="switchView('config')">Núcleo</button>
            </div>
        </div>

        <!-- VIEW 1: ARENAS VERTICALES -->
        <div id="view-arenas" class="game-view active">
            <h1>Chrono Rush</h1>
            <div class="season-tag">Temporada 2: Void Distortion</div>
            <div class="arenas-grid" id="arenas-container"></div>
        </div>

        <!-- VIEW 2: QUANTUM PASS REWARDS -->
        <div id="view-pass" class="game-view">
            <h1>Quantum Pass</h1>
            <div class="season-tag">Rango S2</div>
            <div class="pass-container">
                <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:0.85rem;">
                    <span>Rango: <span id="pass-level-txt">1</span></span>
                    <span>XP: <span id="pass-xp-txt">0/100</span></span>
                </div>
                <div class="progress-bar-bg"><div class="progress-bar-fill" id="pass-bar-fill"></div></div>
                <div class="rewards-timeline" id="pass-timeline-render"></div>
            </div>
        </div>

        <!-- VIEW 3: GACHA CALIBRADO -->
        <div id="view-gacha" class="game-view">
            <h1>Suministros del Vacío</h1>
            <div class="season-tag">Galaxy: 2% | Dorada: 8%</div>
            <div class="gacha-panel">
                <div class="gacha-display-box" id="gacha-result-container">
                    <div style="color:#555; font-size:0.85rem;"><i class="fas fa-box-open" style="font-size:2.5rem; display:block; margin-bottom:8px; color:rgba(0,240,255,0.1);"></i>Contenedor Listo</div>
                </div>
                <button class="btn-action" onclick="buyGachaDrop()"><i class="fas fa-dice-d20"></i> Abrir (50 Cristales)</button>
            </div>
        </div>

        <!-- VIEW 4: CÓDIGOS -->
        <div id="view-config" class="game-view">
            <h1>Consola Verso</h1>
            <div class="season-tag">Inyector de Código</div>
            <div class="generic-panel">
                <div class="form-group" style="margin-bottom:12px;">
                    <input type="text" id="code-input-field" placeholder="Ingresa código del sistema...">
                </div>
                <button class="btn-action" onclick="processSecretCode()">Ejecutar</button>
            </div>
        </div>

        <!-- VIEW 5: ARENA DE COMBATE VERTICAL (TD REAL-TIME) -->
        <div id="view-battle" class="game-view" style="padding: 8px;">
            <div style="display:flex; flex-direction:column; height:100%; gap:8px;">
                
                <!-- Cabezal de Vida Vertical -->
                <div style="display:flex; justify-content:space-between; background:rgba(4,4,12,0.9); padding:8px; border:1px solid rgba(0,240,255,0.2); font-size:0.8rem;">
                    <div style="width:45%;">
                        <div id="player-hp-text" style="font-weight:bold; color:#00f0ff;">1000 HP</div>
                        <div style="background:#111; height:6px; border-radius:3px; overflow:hidden;">
                            <div id="player-base-hp-fill" style="height:100%; width:100%; background:linear-gradient(90deg, #00f0ff, #00ffaa);"></div>
                        </div>
                    </div>
                    <div style="width:45%; text-align:right;">
                        <div id="enemy-hp-text" style="font-weight:bold; color:#ff0055;">ENEMIGOS</div>
                        <div style="background:#111; height:6px; border-radius:3px; overflow:hidden;">
                            <div id="enemy-hp-fill" style="height:100%; width:100%; background:linear-gradient(90deg, #ff0055, #ffaa00);"></div>
                        </div>
                    </div>
                </div>

                <!-- Campo de Batalla Vertical -->
                <div id="arena-stage" onclick="handleArenaGridClick(event)">
                    <div class="base-gate-line"></div>
                    
                    <!-- Capa de Pausa Temporal -->
                    <div id="freeze-ui">
                        <div style="text-align:center;">
                            <h3 style="font-family:'Orbitron'; color:var(--cyber-blue); font-size:0.9rem;"><i class="fas fa-snowflake"></i> CHRONO DRIVE</h3>
                            <p style="font-size:0.7rem; opacity:0.7;">Toca una carta y posiciónala en el mapa</p>
                        </div>
                        <div class="freeze-counter" id="freeze-countdown">5</div>
                        <div style="background:rgba(2,2,8,0.95); padding:8px; border-radius:6px; border:1px solid var(--cyber-blue); width:100%;">
                            <div class="deck-flex-container" id="freeze-internal-hand"></div>
                        </div>
                    </div>
                </div>

                <!-- Footer de Cartas Vertical -->
                <div class="battle-footer-s2">
                    <button class="btn-action" id="freeze-action-btn" onclick="activateChronoRush()" style="background:linear-gradient(135deg, #00f0ff, #7000ff); color:#fff; padding:6px; font-size:0.75rem;">
                        <i class="fas fa-bolt"></i> CHRONO RUSH
                    </button>
                    <div class="deck-flex-container" id="normal-battle-hand"></div>
                    <div id="td-tip-message" style="text-align:center; font-size:0.75rem; color:#8a939e;">Listo para la defensa.</div>
                </div>
            </div>
        </div>

    </div> <!-- FIN PHONE WRAPPER -->

    <!-- MODAL INYECTOR -->
    <div class="modal-overlay" id="admin-modal">
        <div class="modal-box">
            <h3 id="modal-title-node" style="font-family:'Orbitron'; color:var(--cyber-pink);"></h3>
            <p id="admin-modal-text" style="font-size:0.85rem; margin:12px 0; color:#cbd5e1;"></p>
            <button class="btn-action" onclick="closeAdminModal()" style="background:var(--cyber-pink); color:#fff;">Cerrar</button>
        </div>
    </div>

    <script>
        const MASTER_CARDS = [
            { id: "s2_c1", name: "Láser Titán", class: "laser", icon: "fa-satellite-dish", damage: 45, rarity: "common" },
            { id: "s2_c2", name: "Plasma Nova", class: "plasma", icon: "fa-atom", damage: 90, rarity: "rare" },
            { id: "s2_c3", name: "Tesla Voltios", class: "tesla", icon: "fa-bolt-lightning", damage: 145, rarity: "gold" },
            { id: "s2_c4", name: "Cometa Caótico", class: "comet-dasher", icon: "fa-meteor", damage: 240, rarity: "galaxy" }
        ];

        const MASTER_ARENAS = [];
        for(let i=1; i<=20; i++) {
            MASTER_ARENAS.push({
                id: i,
                name: `Sector S2 - ${String(i).padStart(2, '0')}`,
                rewardCoins: 150 + (i * 20),
                rewardXP: 30 + (i * 4),
                baseEnemyHP: 180 + (i * 65),
                enemySpeed: 1.2 + (i * 0.08), // Ajustada velocidad para eje Y
                totalEnemies: 5 + i
            });
        }

        const PASS_REWARDS = [];
        for(let i=1; i<=5; i++) { // Simplificado para formato compacto de celular
            PASS_REWARDS.push({
                tier: i,
                type: i % 2 === 0 ? "crystals" : "coins",
                amount: i % 2 === 0 ? 50 : 250
            });
        }

        let gameState = { username: "Cadete_VERSO", coins: 600, crystals: 150, unlockedArenas: 1, passXP: 0, passLevel: 1, versoVip: false, claimedTiers: [] };
        let currentBattle = { active: false, arenaId: null, playerBaseHP: 1000, totalEnemiesInWave: 0, enemiesRemaining: 0, deployedTowers: [], activeEnemies: [], activeFirePuddles: [], timeFrozen: false, freezeTimeLeft: 0, selectedHandCard: null };
        let enemyIdCounter = 0;
        let tdEngineInterval = null, enemySpawnInterval = null, freezeTimerInterval = null;

        function saveGame() { localStorage.setItem('chronorush_v2_vertical_save', JSON.stringify(gameState)); }
        function loadGame() {
            let saved = localStorage.getItem('chronorush_v2_vertical_save');
            if(saved) { try { gameState = JSON.parse(saved); } catch(e){} }
            updateGlobalNavbarUI();
        }

        function updateGlobalNavbarUI() {
            document.getElementById('nav-coins').innerText = gameState.coins;
            document.getElementById('nav-crystals').innerText = gameState.crystals;
            let uDisplay = document.getElementById('username-display');
            if(gameState.versoVip) {
                document.body.classList.add('verso-vip-mode');
                uDisplay.innerText = "VERSO DEV";
                uDisplay.className = "verso-gold-text";
            } else {
                document.body.classList.remove('verso-vip-mode');
                uDisplay.innerText = "C_VERSO"; uDisplay.className = "";
            }
        }

        function switchView(viewName) {
            if(viewName !== 'battle' && currentBattle.active) endBattleSystem(false, true);
            document.querySelectorAll('.game-view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.btn-menu').forEach(b => b.classList.remove('active'));
            document.getElementById(`view-${viewName}`).classList.add('active');
            let bNode = document.getElementById(`nav-btn-${viewName}`);
            if(bNode) bNode.classList.add('active');

            if(viewName === 'arenas') renderArenasMap();
            if(viewName === 'pass') renderQuantumPass();
            updateGlobalNavbarUI();
        }

        function renderArenasMap() {
            let container = document.getElementById('arenas-container'); container.innerHTML = "";
            MASTER_ARENAS.forEach(arena => {
                let isUnlocked = arena.id <= gameState.unlockedArenas;
                let el = document.createElement('div');
                el.className = `arena-node ${isUnlocked ? 'unlocked' : 'locked'}`;
                el.innerHTML = `
                    <div>
                        <h3>${arena.name}</h3>
                        <div style="font-size:0.75rem; opacity:0.7;">Invasores: ${arena.totalEnemies}</div>
                    </div>
                    <div style="text-align:right; font-size:0.75rem; color:#ffd700;">
                        ${isUnlocked ? `<i class="fas fa-play-circle" style="font-size:1.4rem; color:var(--cyber-blue);"></i>` : `<i class="fas fa-lock" style="color:var(--cyber-pink)"></i>`}
                    </div>
                `;
                if(isUnlocked) el.onclick = () => startBattle(arena.id);
                container.appendChild(el);
            });
        }

        function renderQuantumPass() {
            document.getElementById('pass-level-txt').innerText = gameState.passLevel;
            document.getElementById('pass-xp-txt').innerText = `${gameState.passXP}/100`;
            document.getElementById('pass-bar-fill').style.width = `${gameState.passXP}%`;
            let timeline = document.getElementById('pass-timeline-render'); timeline.innerHTML = "";
            PASS_REWARDS.forEach(reward => {
                let isUnlocked = gameState.passLevel >= reward.tier;
                let isClaimed = gameState.claimedTiers.includes(reward.tier);
                let card = document.createElement('div');
                card.className = `reward-tier-card ${isUnlocked ? 'unlocked-tier' : ''}`;
                card.innerHTML = `
                    <div style="font-size:0.8rem; font-family:'Orbitron';">Rango ${reward.tier}</div>
                    <div style="font-size:0.85rem; font-weight:bold;"><i class="${reward.type==='coins'?'fas fa-coins':'fas fa-gem'}"></i> ${reward.amount}</div>
                `;
                if(isUnlocked && !isClaimed) {
                    let btn = document.createElement('button'); btn.className = "btn-action"; btn.innerText = "Claim";
                    btn.style.padding = "2px 6px"; btn.style.width = "auto"; btn.onclick = () => { gameState.claimedTiers.push(reward.tier); if(reward.type==='coins') gameState.coins+=reward.amount; else gameState.crystals+=reward.amount; saveGame(); renderQuantumPass(); };
                    card.appendChild(btn);
                } else if(isClaimed) {
                    card.innerHTML += `<span style="color:var(--neon-green); font-size:0.75rem;"><i class="fas fa-check"></i></span>`;
                }
                timeline.appendChild(card);
            });
        }

        function buyGachaDrop() {
            if(gameState.crystals < 50) return alert("Faltan Cristales.");
            gameState.crystals -= 50; saveGame(); updateGlobalNavbarUI();
            let container = document.getElementById('gacha-result-container'); container.innerHTML = "";
            let dice = Math.random() * 100, finalCard = MASTER_CARDS[0];
            if(dice <= 2) finalCard = MASTER_CARDS[3];
            else if(dice <= 10) finalCard = MASTER_CARDS[2];
            else if(dice <= 40) finalCard = MASTER_CARDS[1];
            let itemHtml = document.createElement('div');
            itemHtml.className = `card-item ${finalCard.rarity}`;
            itemHtml.innerHTML = `<i class="fas ${finalCard.icon}"></i><div>${finalCard.name}</div>`;
            container.appendChild(itemHtml);
        }

        function renderDeckUI(interactive = false, DOMTargetId = 'normal-battle-hand') {
            let container = document.getElementById(DOMTargetId); if(!container) return;
            container.innerHTML = "";
            MASTER_CARDS.forEach(card => {
                let cardBox = document.createElement('div');
                cardBox.className = `hand-card-s2 ${currentBattle.selectedHandCard && currentBattle.selectedHandCard.id === card.id ? 'selected' : ''}`;
                if(card.rarity === 'gold') cardBox.style.borderColor = 'var(--gold-vip)';
                if(card.rarity === 'galaxy') cardBox.style.borderColor = 'var(--galaxy-purple)';
                cardBox.innerHTML = `<i class="fas ${card.icon}" style="display:block; margin-bottom:2px;"></i>${card.name.split(' ')[0]}`;
                if(interactive) {
                    cardBox.onclick = (e) => { e.stopPropagation(); currentBattle.selectedHandCard = card; renderDeckUI(true, 'freeze-internal-hand'); };
                }
                container.appendChild(cardBox);
            });
        }

        /*************************************************************
         * LÓGICA TOWER DEFENSE REDISEÑADA PARA EJEY (VERTICAL)
         *************************************************************/
        function startBattle(arenaId) {
            let arena = MASTER_ARENAS.find(a => a.id === arenaId); if(!arena) return;
            document.querySelectorAll('.td-unit, .fire-puddle, .visual-comet').forEach(el => el.remove());
            clearInterval(tdEngineInterval); clearInterval(enemySpawnInterval); if(freezeTimerInterval) clearInterval(freezeTimerInterval);

            currentBattle = { active: true, arenaId: arenaId, playerBaseHP: 1000, totalEnemiesInWave: arena.totalEnemies, enemiesRemaining: arena.totalEnemies, deployedTowers: [], activeEnemies: [], activeFirePuddles: [], timeFrozen: false, freezeTimeLeft: 0, selectedHandCard: null };
            enemyIdCounter = 0; document.getElementById('freeze-action-btn').disabled = false; document.getElementById('freeze-ui').style.display = 'none';
            updateBattleHUD(); switchView('battle');

            let spawned = 0;
            enemySpawnInterval = setInterval(() => {
                if(!currentBattle.active) return;
                if(!currentBattle.timeFrozen) {
                    spawnEnemyNode(arena.baseEnemyHP, arena.enemySpeed); spawned++;
                    if(spawned >= arena.totalEnemies) clearInterval(enemySpawnInterval);
                }
            }, 1800);
            tdEngineInterval = setInterval(processPhysicsTick, 33);
        }

        function spawnEnemyNode(hp, speed) {
            enemyIdCounter++;
            let stage = document.getElementById('arena-stage');
            let rect = stage.getBoundingClientRect();
            // Aparecen arriba (Y=10) dispersos en el ancho X
            let enemyObj = { id: enemyIdCounter, x: 30 + (Math.random() * (rect.width - 60)), y: 10, hp: hp, maxHp: hp, speed: speed };
            currentBattle.activeEnemies.push(enemyObj);

            let div = document.createElement('div');
            div.className = "td-unit enemy-marcher"; div.id = `enemy-node-${enemyObj.id}`;
            div.style.left = `${enemyObj.x}px`; div.style.top = `${enemyObj.y}px`;
            div.innerHTML = `<i class="fas fa-space-shuttle" style="color:var(--cyber-pink); transform: rotate(180deg); font-size:0.75rem;"></i>`;
            stage.appendChild(div);
        }

        function activateChronoRush() {
            if(!currentBattle.active || currentBattle.timeFrozen) return;
            currentBattle.timeFrozen = true; currentBattle.freezeTimeLeft = 5; currentBattle.selectedHandCard = null;
            document.getElementById('freeze-ui').style.display = 'flex';
            document.getElementById('freeze-countdown').innerText = 5;
            document.getElementById('freeze-action-btn').disabled = true;
            renderDeckUI(true, 'freeze-internal-hand');

            freezeTimerInterval = setInterval(() => {
                currentBattle.freezeTimeLeft--;
                if(currentBattle.freezeTimeLeft <= 0 || !currentBattle.timeFrozen) {
                    clearInterval(freezeTimerInterval); document.getElementById('freeze-ui').style.display = 'none';
                    document.getElementById('freeze-action-btn').disabled = false; currentBattle.timeFrozen = false;
                    renderDeckUI(false, 'normal-battle-hand');
                } else { document.getElementById('freeze-countdown').innerText = currentBattle.freezeTimeLeft; }
            }, 1000);
        }

        function handleArenaGridClick(e) {
            if(!currentBattle.timeFrozen || !currentBattle.selectedHandCard) return;
            let stage = document.getElementById('arena-stage'); let rect = stage.getBoundingClientRect();
            let clickX = e.clientX - rect.left; let clickY = e.clientY - rect.top;

            // Límite de la barrera inferior
            if(clickY > rect.height - 75) return alert("Muy cerca del escudo electromagnético.");

            let deployedCard = currentBattle.selectedHandCard;
            if(deployedCard.class === "comet-dasher") {
                executeCometImpact(clickX, clickY, deployedCard.damage);
            } else {
                let towerData = { id: Date.now(), x: clickX, y: clickY, cardData: deployedCard, lastShot: 0 };
                currentBattle.deployedTowers.push(towerData);
                let el = document.createElement('div');
                el.className = `td-unit tower-${deployedCard.class}`; el.id = `tower-dom-${towerData.id}`;
                el.style.left = `${clickX}px`; el.style.top = `${clickY}px`;
                el.innerHTML = `<i class="fas ${deployedCard.icon}" style="color:#fff; font-size:0.75rem;"></i>`;
                stage.appendChild(el);
            }

            currentBattle.timeFrozen = false; clearInterval(freezeTimerInterval);
            document.getElementById('freeze-ui').style.display = 'none';
            document.getElementById('freeze-action-btn').disabled = false;
            currentBattle.selectedHandCard = null; renderDeckUI(false, 'normal-battle-hand');
        }

        function executeCometImpact(tx, ty, damageValue) {
            let stage = document.getElementById('arena-stage');
            let comet = document.createElement('div'); comet.className = "visual-comet";
            comet.style.left = `${tx}px`; comet.style.top = `-20px`; stage.appendChild(comet);
            setTimeout(() => { comet.style.left = `${tx}px`; comet.style.top = `${ty}px`; }, 15);
            setTimeout(() => {
                comet.remove();
                currentBattle.activeEnemies.forEach(en => { if(Math.hypot(en.x - tx, en.y - ty) < 55) en.hp -= damageValue; });
                let puddle = document.createElement('div'); puddle.className = "fire-puddle";
                puddle.style.left = `${tx}px`; puddle.style.top = `${ty}px`; stage.appendChild(puddle);
                currentBattle.activeFirePuddles.push({ x: tx, y: ty, damagePerTick: 3, durationTicks: 90, element: puddle });
                verifyInvasorsCasualties();
            }, 220);
        }

        function processPhysicsTick() {
            if(!currentBattle.active || currentBattle.timeFrozen) return;
            let stage = document.getElementById('arena-stage'); let rect = stage.getBoundingClientRect();
            let baseBreached = false;

            // Movimiento vertical: Caen hacia abajo aumentando Y
            currentBattle.activeEnemies.forEach(enemy => {
                enemy.y += enemy.speed;
                let el = document.getElementById(`enemy-node-${enemy.id}`);
                if(el) el.style.top = `${enemy.y}px`;

                currentBattle.activeFirePuddles.forEach(puddle => {
                    if(Math.hypot(enemy.x - puddle.x, enemy.y - puddle.y) < 35) enemy.hp -= puddle.damagePerTick;
                });

                // Cruza la meta inferior
                if(enemy.y >= rect.height - 65) {
                    currentBattle.playerBaseHP -= 100; enemy.hp = -9999; baseBreached = true;
                    if(el) el.remove();
                }
            });

            if(baseBreached) {
                let breachedCount = currentBattle.activeEnemies.filter(en => en.hp === -9999).length;
                currentBattle.enemiesRemaining -= breachedCount;
                currentBattle.activeEnemies = currentBattle.activeEnemies.filter(en => en.hp !== -9999);
                updateBattleHUD(); evaluateMatchEndTriggers();
            }

            verifyInvasorsCasualties();

            currentBattle.activeFirePuddles.forEach(p => { p.durationTicks--; if(p.durationTicks <= 0 && p.element) p.element.remove(); });
            currentBattle.activeFirePuddles = currentBattle.activeFirePuddles.filter(p => p.durationTicks > 0);

            let timeStamp = Date.now();
            currentBattle.deployedTowers.forEach(tower => {
                if(timeStamp - tower.lastShot > 1100) {
                    let nearestTarget = null, shortestDistance = 150;
                    currentBattle.activeEnemies.forEach(en => {
                        let distance = Math.hypot(en.x - tower.x, en.y - tower.y);
                        if(distance < shortestDistance && en.hp > 0) { shortestDistance = distance; nearestTarget = en; }
                    });
                    if(nearestTarget) {
                        nearestTarget.hp -= tower.cardData.damage; tower.lastShot = timeStamp;
                        let domTower = document.getElementById(`tower-dom-${tower.id}`);
                        if(domTower) { domTower.style.filter = "brightness(2)"; setTimeout(() => { if(domTower) domTower.style.filter = "none"; }, 80); }
                    }
                }
            });
        }

        function verifyInvasorsCasualties() {
            if(!currentBattle.active) return;
            let deadNodes = currentBattle.activeEnemies.filter(en => en.hp <= 0);
            if(deadNodes.length > 0) {
                deadNodes.forEach(en => { let domEl = document.getElementById(`enemy-node-${en.id}`); if(domEl) domEl.remove(); currentBattle.enemiesRemaining--; });
                currentBattle.activeEnemies = currentBattle.activeEnemies.filter(en => en.hp > 0);
                updateBattleHUD(); evaluateMatchEndTriggers();
            }
        }

        function updateBattleHUD() {
            document.getElementById('player-base-hp-fill').style.width = `${Math.max(0, (currentBattle.playerBaseHP/1000)*100)}%`;
            document.getElementById('player-hp-text').innerText = `${Math.max(0, currentBattle.playerBaseHP)} HP`;
            let left = Math.max(0, currentBattle.enemiesRemaining);
            document.getElementById('enemy-hp-fill').style.width = `${(left/currentBattle.totalEnemiesInWave)*100}%`;
            document.getElementById('enemy-hp-text').innerText = `${left} Enm. S2`;
            renderDeckUI(false, 'normal-battle-hand');
        }

        function evaluateMatchEndTriggers() {
            if(currentBattle.enemiesRemaining <= 0 && currentBattle.playerBaseHP > 0) endBattleSystem(true);
            else if(currentBattle.playerBaseHP <= 0) endBattleSystem(false);
        }

        function endBattleSystem(isVictory, forcedClosure = false) {
            currentBattle.active = false; clearInterval(tdEngineInterval); clearInterval(enemySpawnInterval); if(freezeTimerInterval) clearInterval(freezeTimerInterval);
            if(forcedClosure) return;

            if(isVictory) {
                let arena = MASTER_ARENAS.find(a => a.id === currentBattle.arenaId);
                gameState.coins += arena.rewardCoins; gameState.passXP += arena.rewardXP;
                if(gameState.passXP >= 100) { gameState.passXP -= 100; gameState.passLevel++; }
                if(currentBattle.arenaId === gameState.unlockedArenas && gameState.unlockedArenas < 20) gameState.unlockedArenas++;
                alert(`¡Victoria!\n+${arena.rewardCoins} Monedas\n+${arena.rewardXP} XP.`);
            } else { alert("Sector destruido."); }
            saveGame(); switchView('arenas');
        }

        function processSecretCode() {
            let field = document.getElementById('code-input-field'), inputString = field.value.trim();
            if(inputString === "VERSO") {
                gameState.versoVip = true; saveGame(); updateGlobalNavbarUI();
                openSystemModal("PROTOCOLO OK", "Firma encriptada. Tu tag ahora brilla en ORO ANIMADO.");
            } else if(inputString === "MEGA ADMIN :)") {
                openSystemModal("ACCESO CENTRAL", "Código correcto. Bienvenido a la consola.");
            } else { alert("Llave incorrecta."); }
            field.value = "";
        }

        function openSystemModal(title, text) {
            document.getElementById('modal-title-node').innerText = title; document.getElementById('admin-modal-text').innerText = text;
            document.getElementById('admin-modal').style.display = 'flex';
        }
        function closeAdminModal() { document.getElementById('admin-modal').style.display = 'none'; }

        function triggerBackgroundEngine() {
            let canvas = document.getElementById('bg-canvas'); let ctx = canvas.getContext('2d');
            function scale() { if(canvas) { canvas.width = canvas.parentElement.clientWidth; canvas.height = canvas.parentElement.clientHeight; } }
            window.onresize = scale; scale();
            let stars = []; for(let i=0; i<40; i++) stars.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, s: Math.random()*0.4 + 0.1 });
            function frame() {
                if(!ctx || !canvas) return;
                ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle = "rgba(176, 38, 255, 0.25)";
                stars.forEach(s => { ctx.fillRect(s.x, s.y, 2, 2); s.y += s.s; if(s.y > canvas.height) s.y = 0; });
                requestAnimationFrame(frame);
            }
            frame();
        }

        window.onload = () => { loadGame(); triggerBackgroundEngine(); renderArenasMap(); };
    </script>
</body>
</html>
